<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Food Recipes</title>
    <link rel="stylesheet" href="feedback.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        function handleSubmit(event) {
            event.preventDefault();  // Prevent form from being submitted to the server

            // Show the custom modal
            document.getElementById("confirmationModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("confirmationModal").style.display = "none";
            window.location.href = "index.html";  // Redirect to the home page (adjust URL as needed)
        }
    </script>
</head>
<body>

    <!-- Navbar Section -->
    <header class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo">Foodie</a>
        </div>
        <div class="navbar-right">
            <a href="index.html" class="home-btn">Home</a>
        </div>
    </header>

    <!-- Feedback Section -->
    <section class="feedback-section">
        <h1>We Value Your Feedback!</h1>
        <p>Please share your thoughts on our recipes and website.</p>

        <!-- Feedback Form -->
        <form action="#" method="POST" class="feedback-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="feedback">Your Feedback:</label>
                <textarea id="feedback" name="feedback" rows="5" placeholder="Enter your feedback..." required></textarea>
            </div>

            <div class="form-group">
                <label for="rating">Rating:</label>
                <select id="rating" name="rating">
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Fair</option>
                    <option value="1">1 - Poor</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </section>

    <!-- Custom Modal for Confirmation -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <h2>Thank You!</h2>
            <p>Your feedback has been submitted successfully.</p>
            <button class="close-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Foodie. All rights reserved.</p>
    </footer>

</body>
</html>
