<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
</head>
<body>
    
    <!-- Header Section -->
    <header>
        <a href="#" class="logo">Foodie</a>
        <nav>
            <ul class="navlist">
                
                <li><a href="#about">About</a></li>
                <li><a href="#feedback">Feedback</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Search Section at Top Center -->
    <section class="search-section">
        <form id="search-form">
            <input type="text" id="search-box" placeholder="Search for a recipe...">
            <button type="submit"><i class="fas fa-search"></i></button>
        </form>
    </section>

    <!-- Parallax Section -->
    <section class="parallax">
        <h1>Welcome to Foodie</h1>
        <p>Discover Delicious Recipes</p>
        <div class="food-images">
            <img src="/cheese cake.jpeg" alt="Food 1">
            <img src="/pancakes.jpeg" alt="Food 2">
            <img src="/spaghetti.jpeg" alt="Food 3">
            <img src="/garlic bread.jpeg" alt="Food 4">
        </div>
    </section>

    <!-- Recipes Section -->
    <div class="recipe-slider" id="recipes"></div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Foodie. All rights reserved.</p>
    </footer>

    
</body>
</html>
