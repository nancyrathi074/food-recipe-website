<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipe</title>
    <link rel="stylesheet" href="view.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet"> -->

</head>
<body>

<!-- Light Color Navbar -->
<nav class="navbar">
    <ul>
        <li><a href="index.html" class="home-btn">Home</a></li>
        <!-- <li><input type="text" id="searchBar" class="search-bar" placeholder="Search recipes..."></li>
        <li><button id="searchBtn" class="search-btn">Search</button></li> -->
    </ul>
</nav>

<div class="tastebite-section">
    <div class="tastebite-logo">
        TasteBite
    </div>
</div>


<!-- Recipe Content Section -->
<div class="container">
    <div class="recipe-header">
        <div class="recipe-image">
            <img src="https://www.themealdb.com/images/media/meals/llcbn01574294058.jpg" alt="Dish Image">
        </div>
        <div class="recipe-details">
            <h1 id="recipe-name">Dish Name</h1>
            <p id="recipe-category"><strong>Category: </strong>Category Name</p>
            <p id="recipe-area"><strong>Area: </strong>Area Name</p>
            <p id="recipe-tags"><strong>Tags: </strong>Tags Here</p>
        </div>
    </div>

    <!-- Ingredients Section -->
    <div class="ingredients">
        <h2>INGREDIENTS</h2>
        <ul id="ingredients-list">
            <!-- Ingredients will be populated here using JavaScript -->
        </ul>
    </div>

    <!-- Recipe Instructions Section -->
    <div class="recipe-instructions">
        <h2>INSTRUCTIONS</h2>
        <ol id="recipe-steps">
            <!-- Recipe steps will be populated here using JavaScript -->
        </ol>
    </div>
</div>


<!-- Feedback Button -->
<button class="feedback-btn" onclick="window.location.href='feedback.html'">Leave Feedback</button>

<!-- Footer -->
<footer>
    <div class="footer-content">
        <p>Made by <strong>Your Name</strong></p>
        <div class="social-media">
            <a href="https://www.facebook.com" target="_blank" class="social-icon"><i class="fab fa-facebook"></i></a>
            <a href="https://twitter.com" target="_blank" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="https://www.instagram.com" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
        </div>
    </div>
</footer>


<script src="view.js"></script>
</body>
</html>
